name: Feature request
description: Suggest a new format, option or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or situation, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: For a new format or option, an example input and the output you'd expect.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you use today instead?
